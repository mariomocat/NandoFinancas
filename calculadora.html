<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
                                   initial-scale=1.0">
    <title>The Investment Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: transparent;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position:absolute;
    left:165px;
    height: 100vh;
    margin-top:55px;
}

.container {
    background-color: transparent;
    border-radius: 10px;
    padding: 40px;
    width: 400px;

    display: flex;
    flex-direction: column;
    text-align: center;
}

h1 {
    color: #007bff;
    margin-bottom: 20px;
}

.input-container {
    margin-bottom: 20px;
}


label {
    display: block;
    font-family: fontinha3;
    margin-bottom: 5px;
    color: #CB96BA;
    font-weight: bold;


}
@font-face {
    font-family:fontinha;
    src: url(Aston\ Script.ttf);
}

@font-face {
    font-family:fontinha2;
    src: url(Wizards\'\ Magic.ttf);
}

@font-face {
    font-family:fontinha3;
    src: url(CursiveSans-Book.ttf);
}

input[type="number"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #f3efef;
    border-radius: 5px;
    box-sizing: border-box;
    margin-top: 5px;
}

button {
    background-color: #9BBCAC;
    color: #fff;
    border: none;
    padding: 12px 20px;
    cursor: pointer;
    border-radius: 5px;
    font-size: 16px;
    font-family:fontinha;
    margin-top: 10px;
}

button:hover {
    background-color: #D0DDC4;
}

.result-container {
    text-align: center;
    margin-top: 20px;
    font-size: 18px;
    font-family:fontinha3;
    color: #CB96BA;
}
</style>
<body>
    <div class="container">

        <div class="input-container">
            <label for="initial-investment">
                  Investimento Inicial (R$):
              </label>
            <input type="number"
                   id="initial-investment" 
                   placeholder="Insira o investimento inicial">
        </div>
        <div class="input-container">
            <label for="interest-rate">
                 Taxa de Juros Anual (%):
              </label>
            <input type="number" 
                   id="interest-rate"
                   placeholder="Insira a taxa de juros anual">
        </div>
        <div class="input-container">
            <label for="investment-years">
                  Anos:
              </label>
            <input type="number"
                   id="investment-years"
                   placeholder="Insira ">
        </div>
        <button id="calculate-button">
              Calculate
          </button>
        <div id="result" 
             class="result-container">
          </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
